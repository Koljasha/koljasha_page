server {
    listen 80;
    server_name koljasha.ru www.koljasha.ru;

    root /var/www/koljasha;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Хешированные ассеты Vite: имя меняется при каждом build, можно кешировать агрессивно.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Точка входа без кеша: иначе браузер может держать старый index.html
    # со ссылками на уже удалённые хешированные файлы.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/html text/css application/javascript;
    gzip_min_length 1024;
}
